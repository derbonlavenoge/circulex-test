<script>
// ---------------------------------------------------------------------------
// Vidéo explicative 120 s : « L'alcool dans le corps » (public : ado de 16 ans)
// render(t) est déterministe : t en secondes -> image complète.
// ---------------------------------------------------------------------------
const C={bg:'#22252A',bg2:'#1A1C20',txt:'#F3F0E8',g1:'#A9ACB2',g2:'#C9CBD0',body:'#3A3F47',
  water:'#2FA8FF',alc:'#FF6B5B',fat:'#FFB627',liver:'#A51F4B',liverT:'#E0577E'};
const DUR=120;

// Texte prononcé (sp, sert au calage) et sous-titre affiché (sub). « | » = découpe des sous-titres.
const LINES=[
 {sp:"Pourquoi le même verre ne fait pas le même effet à tout le monde ?",
  sub:"Pourquoi le même verre ne fait pas le même effet à tout le monde ?"},
 {sp:"L'alcool se répartit dans toute l'eau de ton corps.|Le taux, c'est une concentration :|même dose dans moins d'eau, taux plus haut.",
  sub:"L'alcool se répartit dans toute l'eau de ton corps.|Le taux, c'est une concentration :|même dose dans moins d'eau, taux plus haut."},
 {sp:"Un muscle, c'est environ septante-cinq pour cent d'eau.|La graisse, seulement dix à vingt pour cent.|Et l'alcool va dans l'eau, pas dans la graisse.",
  sub:"Un muscle, c'est environ 75 % d'eau.|La graisse, seulement 10 à 20 %.|Et l'alcool va dans l'eau, pas dans la graisse."},
 {sp:"Deux personnes de septante kilos.|En moyenne, l'homme a plus de muscles : environ soixante pour cent d'eau.|La femme, plus de graisse : environ cinquante.|Même verre, moins d'eau : taux plus haut.",
  sub:"Deux personnes de 70 kilos.|En moyenne, l'homme a plus de muscles : environ 60 % d'eau.|La femme, plus de graisse : environ 50 %.|Même verre, moins d'eau : taux plus haut."},
 {sp:"Attends… donc les filles tiennent moins l'alcool ?",
  sub:"Attends… donc les filles tiennent moins l'alcool ?"},
 {sp:"Non. Ça n'a rien à voir avec « tenir l'alcool ».|C'est une moyenne, pas une règle : juste une question d'eau dans le corps.",
  sub:"Non. Ça n'a rien à voir avec « tenir l'alcool ».|C'est une moyenne, pas une règle : juste une question d'eau dans le corps."},
 {sp:"Le taux monte aussi plus haut si tu pèses moins,|as moins de muscles, bois à jeun ou bois vite.|À seize ans, on pèse souvent moins qu'un adulte :|même verre, taux plus haut.",
  sub:"Le taux monte aussi plus haut si tu pèses moins,|as moins de muscles, bois à jeun ou bois vite.|À 16 ans, on pèse souvent moins qu'un adulte :|même verre, taux plus haut."},
 {sp:"De l'estomac et de l'intestin, l'alcool passe dans le sang,|qui l'emmène partout, jusqu'au cerveau.|À seize ans, ton cerveau se développe encore,|jusqu'à vingt-cinq ans environ : il est plus sensible.",
  sub:"De l'estomac et de l'intestin, l'alcool passe dans le sang,|qui l'emmène partout, jusqu'au cerveau.|À 16 ans, ton cerveau se développe encore,|jusqu'à 25 ans environ : il est plus sensible."},
 {sp:"Ensuite, le foie en élimine plus de nonante pour cent.|Le reste sort par le souffle, l'urine et la sueur.",
  sub:"Ensuite, le foie en élimine plus de 90 %.|Le reste sort par le souffle, l'urine et la sueur."},
 {sp:"Dans le foie, deux enzymes, des petits outils, font le travail.|L'A.D.H. change l'alcool en acétaldéhyde, toxique.|L'A.L.D.H. le change en acétate,|qui finit en eau et en gaz carbonique.",
  sub:"Dans le foie, deux enzymes – des petits outils – font le travail.|L'ADH change l'alcool en acétaldéhyde, toxique.|L'ALDH le change en acétate,|qui finit en eau et en gaz carbonique (CO₂)."},
 {sp:"Le foie va à vitesse fixe :|moins zéro virgule un à zéro virgule quinze pour mille par heure.|De zéro virgule cinq pour mille à zéro : environ trois à cinq heures.",

 {sp:"Et un café, ça n'aide pas ?", sub:"Et un café, ça n'aide pas ?"},
 {sp:"Non. Ni café, ni douche froide, ni eau, ni air frais, ni sport.|Rien n'accélère le foie. Seul le temps.",
  sub:"Non. Ni café, ni douche froide, ni eau, ni air frais, ni sport.|Rien n'accélère le foie. Seul le temps."},
 {sp:"Et le taux monte encore après le dernier verre :|le pic arrive trente à soixante minutes plus tard.|Te sentir bien juste après ne veut pas dire qu'il a fini de monter.",
  sub:"Et le taux monte encore après le dernier verre :|le pic arrive 30 à 60 minutes plus tard.|Te sentir bien juste après ne veut pas dire qu'il a fini de monter."},
 {sp:"À retenir : c'est une concentration.|Moins d'eau, taux plus haut. Le pic vient après.|Le foie va à vitesse fixe.|Seul le temps fait baisser le taux.",
  sub:"À retenir : c'est une concentration.|Moins d'eau, taux plus haut. Le pic vient après.|Le foie va à vitesse fixe.|Seul le temps fait baisser le taux."},
 {sp:"Maintenant, tu sais comment ça marche.", sub:"Maintenant, tu sais comment ça marche."},
];
LINES.forEach((L,i)=>Object.assign(L,window.TL[i]));
const ERR=[];
function L(i){return LINES[i-1];}
function at(i,phrase){ // instant (s) où la phrase est dite dans la réplique i (proportionnel aux caractères)
  const l=L(i), s=l.sp.replace(/\|/g,''), k=s.indexOf(phrase);
  if(k<0){ERR.push(`cue introuvable: ${i} « ${phrase} »`);return l.start;}
  return l.start+l.dur*k/s.length;
}
// fenêtres des scènes
const SC={};
for(let k=1;k<=12;k++){const first=LINES.find(l=>l.scene===k);SC[k]={a:k===1?0:first.start-0.35};}
for(let k=1;k<=12;k++){SC[k].b=k<12?SC[k+1].a:DUR;}

// ---------- outils ----------
const cl=x=>Math.max(0,Math.min(1,x));
const P=(t,a,d)=>cl((t-a)/d);
const oc=x=>1-Math.pow(1-x,3);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bo=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const lerp=(a,b,x)=>a+(b-a)*x;
const f=n=>Math.round(n*100)/100;
function rnd(seed){let s=seed*9301+49297;return ()=>{s=(s*9301+49297)%233280;return s/233280;};}
let UID=0; const uid=p=>p+(UID++);

function G(inner,o={}){const {x=0,y=0,s=1,o:op=1,r=0}=o; if(op<=0.003||s<=0.001)return '';
  return `<g transform="translate(${f(x)} ${f(y)})${r?` rotate(${f(r)})`:''}${s!==1?` scale(${f(s)})`:''}"${op<1?` opacity="${f(op)}"`:''}>${inner}</g>`;}
function T(str,x,y,o={}){const {size=60,w=800,fill=C.txt,anchor='middle',ls=0,extra=''}=o;
  return `<text x="${f(x)}" y="${f(y)}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}"${ls?` letter-spacing="${ls}"`:''} ${extra}>${str}</text>`;}
// apparitions
const rise=(inner,t,a,x,y,s=1,d=.55)=>G(inner,{x,y:y+46*(1-oc(P(t,a,d))),o:oc(P(t,a,d*.8)),s});
const pop=(inner,t,a,x,y,s=1)=>G(inner,{x,y,s:s*bo(P(t,a,.45)),o:P(t,a,.12)});
const fade=(inner,t,a,d=.4)=>G(inner,{o:P(t,a,d)});

// ---------- illustrations ----------
function glass(level=.7,t=0){ // bas-centre en (0,0)
  const id=uid('gl'), top=-150, ly=top*level;
  const wave=[];for(let x=-62;x<=62;x+=8)wave.push(`${x},${f(ly+3*Math.sin(x/12+t*4))}`);
  return `<defs><clipPath id="${id}"><polygon points="-60,-150 60,-150 42,0 -42,0"/></clipPath></defs>
  <polygon points="-60,-150 60,-150 42,0 -42,0" fill="rgba(255,255,255,.06)"/>
  <g clip-path="url(#${id})">${level>0?`<polygon points="-70,10 70,10 ${wave.reverse().join(' ')}" fill="${C.alc}"/>`:''}</g>
  <polygon points="-60,-150 60,-150 42,0 -42,0" fill="none" stroke="${C.g2}" stroke-width="7" stroke-linejoin="round"/>
  <line x1="-34" y1="-128" x2="-24" y2="-30" stroke="rgba(255,255,255,.25)" stroke-width="7" stroke-linecap="round"/>`;
}
const dot=(x,y,r=11,c=C.alc)=>`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}"/>`;

const BODY={
 man:{h:588,shapes:`<circle cx="0" cy="-530" r="58"/><rect x="-95" y="-462" width="190" height="262" rx="46"/>
  <rect x="-140" y="-450" width="38" height="235" rx="19"/><rect x="102" y="-450" width="38" height="235" rx="19"/>
  <rect x="-82" y="-215" width="72" height="215" rx="30"/><rect x="10" y="-215" width="72" height="215" rx="30"/>`},
 woman:{h:581,shapes:`<circle cx="0" cy="-525" r="56"/>
  <path d="M-72,-462 H72 Q88,-462 86,-440 L74,-330 Q104,-262 106,-215 Q106,-198 90,-198 H-90 Q-106,-198 -106,-215 Q-104,-262 -74,-330 L-86,-440 Q-88,-462 -72,-462 Z"/>
  <rect x="-122" y="-450" width="34" height="226" rx="17"/><rect x="88" y="-450" width="34" height="226" rx="17"/>
  <rect x="-90" y="-215" width="74" height="215" rx="30"/><rect x="16" y="-215" width="74" height="215" rx="30"/>`},
};
// silhouette : kind, niveau d'eau 0..1, extra = contenu dessiné dans le corps (clippé)
function person(kind,level,t,{extra='',fatO=0,col=C.body}={}){
  const B=BODY[kind], id=uid('cp'), top=-B.h*level;
  const wave=[];for(let x=-170;x<=170;x+=10)wave.push(`${x},${f(top+7*Math.sin(x/28+t*3.2))}`);
  const fat= fatO>0 ? (kind==='woman'
     ? `<g opacity="${f(fatO)}" fill="${C.fat}"><ellipse cx="-92" cy="-245" rx="46" ry="62"/><ellipse cx="92" cy="-245" rx="46" ry="62"/><ellipse cx="0" cy="-300" rx="70" ry="26"/><ellipse cx="-58" cy="-150" rx="34" ry="44"/><ellipse cx="58" cy="-150" rx="34" ry="44"/></g>`
     : `<g opacity="${f(fatO)}" fill="${C.fat}"><ellipse cx="0" cy="-292" rx="56" ry="20"/><ellipse cx="-85" cy="-230" rx="22" ry="30"/><ellipse cx="85" cy="-230" rx="22" ry="30"/></g>`):'';
  return `<defs><clipPath id="${id}">${B.shapes}</clipPath></defs>
   <g fill="${col}">${B.shapes}</g>
   <g clip-path="url(#${id})">${level>0?`<polygon points="-180,10 180,10 ${wave.reverse().join(' ')}" fill="${C.water}"/>`:''}${fat}${extra}</g>`;
}
function liver(t=0,gulp=0){ // centré
  const sx=1+.08*gulp, sy=1-.06*gulp;
  return `<g transform="scale(${f(sx)} ${f(sy)})"><path d="M-130,-10 C-136,-72 -60,-98 12,-88 C82,-80 136,-62 128,-20 C121,20 62,30 12,56 C-40,82 -122,62 -130,-10 Z" fill="${C.liver}"/>
   <ellipse cx="-40" cy="-50" rx="48" ry="15" transform="rotate(-12 -40 -50)" fill="rgba(255,255,255,.2)"/></g>`;
}
function hourglass(t,run=0){ // centré, hauteur ~240
  const k=cl(run), topH=60*(1-k), botH=60*k;
  return `<rect x="-90" y="-128" width="180" height="20" rx="10" fill="${C.g2}"/><rect x="-90" y="108" width="180" height="20" rx="10" fill="${C.g2}"/>
  <path d="M-70,-108 H70 C70,-40 12,-14 12,0 C12,14 70,40 70,108 H-70 C-70,40 -12,14 -12,0 C-12,-14 -70,-40 -70,-108 Z" fill="rgba(255,255,255,.07)" stroke="${C.g2}" stroke-width="6"/>
  <path d="M${f(-60*(topH/60))},${f(-8-topH)} H${f(60*(topH/60))} L0,-6 Z" fill="${C.txt}"/>
  ${k>0&&k<1?`<line x1="0" y1="-6" x2="0" y2="104" stroke="${C.txt}" stroke-width="4"/>`:''}
  <path d="M-64,106 Q0,${f(106-botH*1.6)} 64,106 Z" fill="${C.txt}"/>`;
}
function bubble(str,x,y,t,a,size=54){ // bulle question d'ado
  const w=str.length*size*.53+90, h=size*1.9;
  const s=bo(P(t,a,.45)), o=P(t,a,.12);
  return G(`<rect x="${f(-w/2)}" y="${f(-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${C.txt}"/>
   <path d="M-40,${f(h/2-4)} L-70,${f(h/2+40)} L0,${f(h/2-4)} Z" fill="${C.txt}"/>
   ${T(str,0,size*.36,{size,w:800,fill:C.bg})}`,{x,y,s,o});
}
function gauge(level,label='taux',hl=0){ // bas-centre (0,0), hauteur 230
  const h=230*cl(level);
  return `<rect x="-26" y="-230" width="52" height="230" rx="26" fill="${C.bg2}" stroke="${C.body}" stroke-width="4"/>
  ${h>2?`<rect x="-20" y="${f(-h+(-6)*0)}" width="40" height="${f(Math.max(h-6,1))}" rx="20" fill="${C.alc}" transform="translate(0 -3)"/>`:''}
  ${T(label,0,48,{size:32,w:800,fill:C.g2})}
  ${hl>0?G(`<path d="M0,-40 L26,0 H10 V36 H-10 V0 H-26 Z" fill="${C.alc}"/>`,{x:62,y:-200,o:hl,s:.9+.1*hl}):''}`;
}
const arrowUp=(c=C.alc)=>`<path d="M0,-34 L30,4 H11 V34 H-11 V4 H-30 Z" fill="${c}"/>`;
const arrowR=(w=150,c=C.g2)=>`<line x1="0" y1="0" x2="${w-22}" y2="0" stroke="${c}" stroke-width="10" stroke-linecap="round"/><path d="M${w},0 L${w-30},-20 L${w-30},20 Z" fill="${c}"/>`;
function strike(k){ // barre diagonale
  return k>0?`<line x1="-80" y1="80" x2="${f(-80+160*k)}" y2="${f(80-160*k)}" stroke="${C.alc}" stroke-width="16" stroke-linecap="round"/>`:'';
}
// petits pictos (centrés, ~140 px)
const ICON={
 scale:`<rect x="-70" y="-10" width="140" height="70" rx="18" fill="${C.g2}"/><circle cx="0" cy="25" r="22" fill="${C.bg}"/><line x1="0" y1="25" x2="12" y2="10" stroke="${C.alc}" stroke-width="5" stroke-linecap="round"/><rect x="-50" y="-34" width="100" height="16" rx="8" fill="${C.g1}"/>`,
 dumbbell:`<rect x="-60" y="-8" width="120" height="16" rx="8" fill="${C.g1}"/><rect x="-78" y="-40" width="26" height="80" rx="10" fill="${C.g2}"/><rect x="52" y="-40" width="26" height="80" rx="10" fill="${C.g2}"/><rect x="-98" y="-26" width="18" height="52" rx="8" fill="${C.g2}"/><rect x="80" y="-26" width="18" height="52" rx="8" fill="${C.g2}"/>`,
 plate:`<circle cx="0" cy="0" r="62" fill="${C.g2}"/><circle cx="0" cy="0" r="40" fill="none" stroke="${C.g1}" stroke-width="5"/><rect x="-92" y="-50" width="10" height="100" rx="5" fill="${C.g1}"/><rect x="82" y="-50" width="10" height="100" rx="5" fill="${C.g1}"/>`,
 watch:`<circle cx="0" cy="8" r="58" fill="${C.g2}"/><circle cx="0" cy="8" r="44" fill="${C.bg}"/><rect x="-14" y="-70" width="28" height="18" rx="6" fill="${C.g2}"/><line x1="0" y1="8" x2="0" y2="-28" stroke="${C.alc}" stroke-width="7" stroke-linecap="round"/><line x1="0" y1="8" x2="22" y2="20" stroke="${C.txt}" stroke-width="6" stroke-linecap="round"/><path d="M-100,-10 H-72 M-110,12 H-72 M-100,34 H-74" stroke="${C.g1}" stroke-width="7" stroke-linecap="round"/>`,
 coffee:`<path d="M-55,-30 H45 V20 C45,50 25,62 -5,62 C-35,62 -55,50 -55,20 Z" fill="${C.g2}"/><path d="M45,-14 C80,-14 80,30 45,30" fill="none" stroke="${C.g2}" stroke-width="10"/><path d="M-25,-48 C-35,-62 -15,-70 -25,-86 M5,-48 C-5,-62 15,-70 5,-86" fill="none" stroke="${C.g1}" stroke-width="6" stroke-linecap="round"/><rect x="-70" y="62" width="130" height="10" rx="5" fill="${C.g1}"/>`,
 shower:`<path d="M-60,-70 H10 Q30,-70 30,-50 V-40" fill="none" stroke="${C.g2}" stroke-width="10" stroke-linecap="round"/><path d="M-10,-40 H70 L56,-14 H4 Z" fill="${C.g2}"/>${[[10,10],[30,30],[50,10],[20,55],[45,60],[0,40]].map(([x,y])=>`<line x1="${x}" y1="${y}" x2="${x-5}" y2="${y+16}" stroke="${C.water}" stroke-width="7" stroke-linecap="round"/>`).join('')}`,
 water:`<path d="M0,-70 C30,-30 52,0 52,24 C52,54 28,72 0,72 C-28,72 -52,54 -52,24 C-52,0 -30,-30 0,-70 Z" fill="${C.water}"/><ellipse cx="-18" cy="24" rx="9" ry="18" fill="rgba(255,255,255,.35)"/>`,
 wind:`<path d="M-80,-30 H30 C60,-30 60,-70 30,-70 M-80,5 H60 C95,5 95,50 60,50 M-80,40 H0" fill="none" stroke="${C.g2}" stroke-width="12" stroke-linecap="round"/>`,
 run:`<circle cx="18" cy="-62" r="18" fill="${C.g2}"/><path d="M8,-38 L-12,10 L18,40 L8,78 M-12,10 L-40,58 M2,-30 L40,-6 M2,-30 L-34,-14" fill="none" stroke="${C.g2}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`,
 breath:`<circle cx="-40" cy="0" r="38" fill="${C.g2}"/><path d="M10,-20 H70 M10,0 H90 M10,20 H62" stroke="${C.g1}" stroke-width="8" stroke-linecap="round"/>`,
 drop2:`<path d="M0,-46 C20,-20 34,0 34,16 C34,36 18,48 0,48 C-18,48 -34,36 -34,16 C-34,0 -20,-20 0,-46 Z" fill="${C.g2}"/>`,
 sweat:`<circle cx="0" cy="0" r="42" fill="${C.g2}"/><path d="M50,-30 C58,-18 64,-10 64,-2 C64,8 58,14 50,14 C42,14 36,8 36,-2 C36,-10 42,-18 50,-30 Z" fill="${C.water}"/><path d="M-20,-6 h10 M10,-6 h10 M-14,18 Q0,8 14,18" stroke="${C.bg}" stroke-width="5" fill="none" stroke-linecap="round"/>`,
 wrench:`<path d="M-50,50 L20,-20" stroke="${C.g2}" stroke-width="22" stroke-linecap="round"/><path d="M14,-44 A30,30 0 1 0 44,-14 L26,-16 L16,-26 Z" fill="${C.g2}"/>`,
};

// ---------- cues & bruitages ----------
const SFX=[]; const sfx=(type,t,v=1)=>{SFX.push({type,t:Math.round(t*1000)/1000,v});return t;};
const K={};
function buildCues(){
 // S1
 K.s1Glass=sfx('pop',.55); sfx('whoosh',.12,.6); K.s1Bub=sfx('pop',L(1).start-.15,.8);
 // S2
 const a2=SC[2].a; K.s2Fill=sfx('bubbles',a2+.25); K.s2Title=at(2,"Le taux"); sfx('whoosh',K.s2Title,.5);
 K.s2Drop=at(2,"même dose"); for(let j=0;j<8;j+=2)sfx('plop',K.s2Drop+.45+j*.07,.7);
 K.s2Badge=sfx('pop',at(2,"taux plus haut"));
 // S3
 K.s3Mus=at(3,"Un muscle"); sfx('bubbles',K.s3Mus+.3); K.s3_75=sfx('pop',at(3,"septante-cinq"),.7);
 K.s3Fat=at(3,"La graisse"); sfx('bubbles',K.s3Fat+.3,.6); K.s3_20=sfx('pop',at(3,"dix à vingt"),.7);
 K.s3Drop=at(3,"Et l'alcool"); for(let j=0;j<7;j+=2)sfx('plop',K.s3Drop+.5+j*.08,.7);
 K.s3Ban=sfx('whoosh',at(3,"va dans l'eau"),.6);
 // S4
 K.s4P=sfx('whoosh',at(4,"Deux personnes"),.6); K.s4kg=sfx('pop',K.s4P+.5,.5);
 K.s4Man=at(4,"l'homme"); sfx('bubbles',K.s4Man+.2); K.s4_60=sfx('pop',at(4,"environ soixante"),.7);
 K.s4Wom=at(4,"La femme"); sfx('bubbles',K.s4Wom+.2); K.s4Fat=K.s4Wom+.3; K.s4_50=sfx('pop',at(4,"environ cinquante"),.7);
 K.s4Glass=at(4,"Même verre"); for(let j=0;j<8;j+=2){sfx('plop',K.s4Glass+.7+j*.07,.6);}
 K.s4Gauge=at(4,"moins d'eau"); K.s4Hl=sfx('pop',at(4,"taux plus haut"),.8);
 K.s4Bub=sfx('pop',L(5).start-.15,.8);
 K.s4No=sfx('stamp',L(6).start); K.s4Rien=at(6,"Ça n'a rien"); K.s4Moy=sfx('stamp',at(6,"C'est une moyenne"),.8);
 K.s4Eau=sfx('pop',at(6,"juste une question"),.7);
 // S5
 K.s5Title=sfx('whoosh',SC[5].a+.1,.5);
 K.s5c=[at(7,"si tu pèses"),at(7,"as moins"),at(7,"bois à jeun"),at(7,"bois vite")]; K.s5c.forEach(x=>sfx('pop',x,.8));
 K.s5Teen=sfx('whoosh',at(7,"À seize ans"),.6); K.s5Glass=at(7,"même verre"); sfx('pop',K.s5Glass+.5,.6);

function subtitle(t){
 for(const l of LINES){
  if(l.spk==='A')continue; if(l.scene>=11)continue;
  if(t<l.start-.05||t>l.start+l.dur+.25)continue;
  const sp=l.sp.split('|'), sb=l.sub.split('|'), tot=sp.join('').length;
  let acc=0;
  for(let j=0;j<sp.length;j++){
   const a=l.start+l.dur*acc/tot; acc+=sp[j].length; const b=l.start+l.dur*acc/tot;
   if(t>=a-.05&&(t<b||j===sp.length-1)){
     const o=Math.min(P(t,a-.05,.12),1-P(t,l.start+l.dur+.1,.15));
     return G(T(sb[j].trim(),960,1032,{size:40,w:500,fill:C.txt,extra:`stroke="${C.bg2}" stroke-width="12" paint-order="stroke" stroke-linejoin="round"`}),{o});
   }
  }
 }
 return '';
}

// ---------- composition ----------
function background(t){
 return `<defs><radialGradient id="vg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#282C32"/><stop offset="1" stop-color="${C.bg2}"/></radialGradient></defs>
  <rect width="1920" height="1080" fill="url(#vg)"/>`;
}
function progress(t){ // fine barre de progression en bas
 return `<rect x="0" y="1074" width="${f(1920*t/DUR)}" height="6" fill="${C.water}" opacity=".7"/>`;
}
function render(t){
 UID=0;
 let out=background(t);
 for(let k=1;k<=12;k++){
  const {a,b}=SC[k];
  if(t<a||t>=b+.35)continue;
  const fin=k===1?1:oc(P(t,a,.35)), fout=k<12?1-P(t,b,.3):1;
  const o=Math.min(fin,fout);
  const slide=k===1?0:40*(1-fin);
  out+=G(S[k](t),{o,x:slide});
 }
 out+=subtitle(t);
 out+=progress(t);
 const fo=P(t,DUR-1.1,1.0), fi=1-P(t,0,.4);
 const blk=Math.max(fo,fi);
 if(blk>0)out+=`<rect width="1920" height="1080" fill="#000" opacity="${f(blk)}"/>`;
 document.getElementById('v').innerHTML=out;
}
window.render=render; window.SFX=SFX; window.ERR=ERR; window.SC=SC; window.LINES=LINES;
render(parseFloat(new URLSearchParams(location.search).get('t')||'6'));
</script>
